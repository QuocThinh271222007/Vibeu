function mutatePath(path,value){let target=nail();const pieces=path.split('.');if(pieces[0]==='light'){target=model.light;pieces.shift()}else if(pieces[0]==='layer'){target=activeLayer();pieces.shift()}else if(pieces[0]==='stop'){target=nail().paint.stops[selectedStop];pieces.shift()}

 for(let i=0;i<pieces.length-1;i++)target=target[pieces[i]];
 const percent=['paint.opacity','pattern.size','pattern.opacity','material.gloss','material.roughness','material.glitter','light.strength','light.photo','layer.opacity','layer.size','calibration.scale','stop.at'];
 target[pieces.at(-1)]=percent.includes(path)?Number(value)/100:value;

 const i=engine.hit(model.current,states(),p);if(i<0)return;if(i!==model.selected)selectFinger(i);const l=layerAt(i,p);if(l){selectedLayer=l.id;inspectorTab='layers';const q=calibrationPoint(p,nail().calibration,geom().center,true),uv=geom().toUV(q);begin();drag={kind:'layer',id:e.pointerId,start:uv,u:l.u,v:l.v};renderInspector();scene.setPointerCapture(e.pointerId)}else{selectedLayer=null;renderInspector()}schedule();
});
scene.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const uv=geom().toUV(calibrationPoint(pointAt(e),nail().calibration,geom().center,true));if(drag.kind==='layer'){const l=activeLayer();if(l){l.u=clamp(drag.u+uv[0]-drag.start[0],-.5,1.5);l.v=clamp(drag.v+uv[1]-drag.start[1],-.5,1.5)}}else nail().paint[drag.key]=uv.map(v=>clamp(v,-.5,1.5));schedule()});
function endDrag(){if(!drag)return;drag=null;commit();renderInspector()}
scene.addEventListener('pointerup',endDrag);scene.addEventListener('pointercancel',endDrag);
$('#inspector-body').addEventListener('pointerdown',e=>{const stop=e.target.closest('[data-stop]');if(!stop)return;e.preventDefault();selectedStop=Number(stop.dataset.stop);begin();const bar=$('#gradient-bar'),rect=bar.getBoundingClientRect();stop.setPointerCapture(e.pointerId);const move=ev=>{nail().paint.stops[selectedStop].at=clamp((ev.clientX-rect.left)/rect.width);stop.style.left=nail().paint.stops[selectedStop].at*100+'%';bar.style.background=gradientCSS(nail().paint);schedule()};const end=()=>{stop.removeEventListener('pointermove',move);commit();renderInspector()};stop.addEventListener('pointermove',move);stop.addEventListener('pointerup',end,{once:true});stop.addEventListener('pointercancel',end,{once:true})});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-color],[data-sticker],[data-asset]');if(!el)return;const payload=el.dataset.color?{kind:'color',key:el.dataset.color}:el.dataset.sticker?{kind:'sticker',key:el.dataset.sticker}:{kind:'image',key:el.dataset.asset};e.dataTransfer.setData('application/x-vibeu',JSON.stringify(payload));e.dataTransfer.effectAllowed='copy'});
$('#canvas-scroll').addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';$('#canvas-scroll').classList.add('dragover')});
$('#canvas-scroll').addEventListener('dragleave',()=>$('#canvas-scroll').classList.remove('dragover'));
$('#canvas-scroll').addEventListener('drop',async e=>{e.preventDefault();$('#canvas-scroll').classList.remove('dragover');const p=pointAt(e),i=engine.hit(model.current,states(),p);if(i<0){toast('Thả vào bên trong một móng; phóng to nếu cần.');return}if(e.dataTransfer.files.length){await uploadFiles(e.dataTransfer.files,i,p);return}try{const d=JSON.parse(e.dataTransfer.getData('application/x-vibeu'));if(d.kind==='color'&&/^#[0-9a-f]{6}$/i.test(d.key))change(()=>{model.selected=i;nail().paint.color=d.key;nail().paint.mode='solid'});else if(d.kind==='sticker'&&stickerNames[d.key])addLayer('sticker',d.key,i,p);else if(d.kind==='image'&&assets[d.key])addLayer('image',d.key,i,p)}catch{}});
$('#library-body').addEventListener('dragover',e=>{if(e.target.closest('#upload-zone'))e.preventDefault()});$('#library-body').addEventListener('drop',e=>{if(e.target.closest('#upload-zone')){e.preventDefault();uploadFiles(e.dataTransfer.files)}});
async function uploadFiles(files,i,point){let count=0;for(const f of Array.from(files).slice(0,12)){if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)){toast('Ảnh hỗ trợ: PNG, JPG, WebP và GIF.');continue}if(f.size>25*1024*1024){toast('Ảnh '+f.name+' lớn hơn 25 MB.');continue}try{const url=URL.createObjectURL(f);let img;try{img=await load(url)}finally{URL.revokeObjectURL(url)}if(img.width*img.height>40000000)throw new Error('Ảnh quá lớn');const ratio=Math.min(1,2048/Math.max(img.width,img.height)),c=make(Math.round(img.width*ratio),Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const src=c.toDataURL('image/png'),id=uid();assets[id]={name:f.name.slice(0,100),src};engine.assetImages.set(id,await load(src));count++;if(i!=null)addLayer('image',id,i,point)}catch{toast('Không đọc được ảnh '+f.name)}}if(count){libraryTab='images';renderLibrary();toast('Đã tải '+count+' ảnh'+(i==null?'. Bấm hoặc kéo ảnh vào móng.':'.'))}$('#image-input').value=''}
$('#image-input').onchange=e=>uploadFiles(e.target.files);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('#redo'):$('#undo')).click();return}if(e.key==='Escape'){$('#modal-root').innerHTML='';selectedLayer=null;schedule();return}if(document.activeElement===scene&&activeLayer()){if(['Delete','Backspace'].includes(e.key)){e.preventDefault();actions['layer-delete']()}const dirs={ArrowLeft:[-.01,0],ArrowRight:[.01,0],ArrowUp:[0,-.01],ArrowDown:[0,.01]};if(dirs[e.key]){e.preventDefault();change(()=>{const d=dirs[e.key],l=activeLayer(),k=e.shiftKey?5:1;l.u=clamp(l.u+d[0]*k,-.5,1.5);l.v=clamp(l.v+d[1]*k,-.5,1.5)},false)}}});
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function saveCanvas(c,name){c.toBlob(b=>{if(b){download(b,name);toast('Đã chuẩn bị ảnh tải xuống')}else toast('Không xuất được ảnh')},'image/png')}
function modal(html){$('#modal-root').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="Tùy chọn thiết kế">'+html+'<button class="button white full" id="close-modal">Đóng</button></section></div>';$('#close-modal').onclick=()=>$('#modal-root').innerHTML='';$('#close-modal').focus()}
function exportModal(maps=false){modal('<h2>'+(maps?'Xuất lớp bề mặt':'Thiết kế của bạn')+'</h2><p>Xuất PNG theo kích thước ảnh gốc, không có đường viền chọn hoặc tay nắm chỉnh sửa.</p>'+(maps?'':'<button class="button dark full" data-export="whole">Tải ảnh toàn bộ bàn tay</button><button class="button white full" data-export="nail">Tải móng đang chọn · nền trong suốt</button><button class="button white full" data-export="transparent">Tải cả 5 móng · nền trong suốt</button>')+'<div class="divider"></div><p>Map cho '+esc(set().nails[model.selected].name.toLowerCase())+' · '+esc(set().name)+'</p><div class="inline"><button class="button small" data-export="normal">Pháp tuyến</button><button class="button small" data-export="diffuse">Ánh sáng</button><button class="button small" data-export="specular">Phản sáng</button><button class="button small" data-export="mask">Mask</button></div>');$$('[data-export]').forEach(b=>b.onclick=()=>{const type=b.dataset.export;let c;if(type==='whole'||type==='transparent'){c=make(set().width,set().height);engine.render(c,model.current,states(),model.light,{transparent:type==='transparent'})}else if(type==='nail')c=engine.renderNail(model.current,model.selected,nail(),model.light);else c=engine.map(model.current,model.selected,type);saveCanvas(c,'VIBEU-'+model.current+'-'+(type==='whole'||type==='transparent'?type:set().nails[model.selected].id+'-'+type)+'.png')})}
$('#export').onclick=()=>exportModal();
$('#save-project').onclick=()=>{commit();download(new Blob([JSON.stringify({format:'vibeu-studio-pro',version:1,model,assets})],{type:'application/json'}),'VIBEU-thiet-ke.json');toast('Đã lưu thiết kế; dùng Mở thiết kế để chỉnh tiếp.')};
$('#import-project').onclick=()=>$('#project-input').click();
function validateProject(raw){
 if(raw?.format!=='vibeu-studio-pro'||raw.version!==1||!raw.model||!raw.assets)throw new Error('Định dạng thiết kế không hợp lệ');
 const enums={mode:['original','solid','linear','radial','aurora'],material:Object.keys(materialNames),pattern:['none','french','marble','dots','stripes']};
 const num=(x,a,b)=>{if(typeof x!=='number'||!Number.isFinite(x))throw new Error('Thông số không hợp lệ');return clamp(x,a,b)};
 const hex=x=>{if(typeof x!=='string'||!/^#[0-9a-fA-F]{6}$/.test(x))throw new Error('Mã màu không hợp lệ');return x};
 const one=(x,a)=>{if(!a.includes(x))throw new Error('Kiểu lớp không được hỗ trợ');return x};
 const point=p=>{if(!Array.isArray(p)||p.length!==2)throw new Error('Tọa độ không hợp lệ');return p.map(x=>num(x,-.5,1.5))};
 const cleanAssets={};if(Object.keys(raw.assets).length>100)throw new Error('Quá nhiều ảnh');for(const [id,a] of Object.entries(raw.assets)){if(!/^[a-zA-Z0-9_-]{1,100}$/.test(id)||!a||typeof a.src!=='string'||!/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(a.src)||a.src.length>16000000)throw new Error('Ảnh trong thiết kế không hợp lệ');Object.defineProperty(cleanAssets,id,{value:{name:String(a.name||'Ảnh').slice(0,100),src:a.src},enumerable:true,writable:true})}
 const next={current:one(raw.model.current,SETS.map(s=>s.id)),selected:Math.round(num(raw.model.selected,0,4)),states:{},light:{}};
 for(const s of SETS){const arr=raw.model.states?.[s.id];if(!Array.isArray(arr)||arr.length!==5)throw new Error('Thiếu vùng móng');next.states[s.id]=arr.map((n,i)=>{const d=defaultNail(s.nails[i]),p=n.paint,m=n.material,t=n.pattern,c=n.calibration;if(!p||!m||!t||!c||!Array.isArray(n.layers)||n.layers.length>40)throw new Error('Lớp móng không hợp lệ');if(!Array.isArray(p.stops)||p.stops.length<2||p.stops.length>5)throw new Error('Gradient cần 2–5 điểm màu');d.paint={mode:one(p.mode,enums.mode),color:hex(p.color),opacity:num(p.opacity,0,1),start:point(p.start),end:point(p.end),stops:p.stops.map(x=>({at:num(x.at,0,1),color:hex(x.color)}))};d.material={type:one(m.type,enums.material),gloss:num(m.gloss,0,1),roughness:num(m.roughness,0,1),glitter:num(m.glitter,0,1),catAngle:num(m.catAngle,-180,180)};d.pattern={type:one(t.type,enums.pattern),color:hex(t.color),size:num(t.size,.04,.45),opacity:num(t.opacity,0,1)};d.calibration={x:num(c.x,-30,30),y:num(c.y,-30,30),angle:num(c.angle,-15,15),scale:num(c.scale,.9,1.1)};d.layers=n.layers.map(l=>{const layer={id:uid(),kind:one(l.kind,['image','sticker']),u:num(l.u,-.5,1.5),v:num(l.v,-.5,1.5),size:num(l.size,.08,2),rotation:num(l.rotation,-180,180),opacity:num(l.opacity,0,1),visible:l.visible!==false,depth:!!l.depth,flip:!!l.flip,surface:l.surface!==false,blend:one(l.blend||'source-over',['source-over','multiply','screen']),color:hex(l.color||'#e9b7cb')};if(layer.kind==='image'){if(!Object.hasOwn(cleanAssets,l.asset))throw new Error('Thiếu ảnh của lớp');layer.asset=l.asset}else layer.type=one(l.type,Object.keys(stickerNames));return layer});return d})}
 const light=raw.model.light;next.light={angle:num(light.angle,-180,180),elevation:num(light.elevation,15,90),strength:num(light.strength,0,1),ambient:num(light.ambient,.3,1.3),photo:num(light.photo,0,1)};return{model:next,assets:cleanAssets};
}
$('#project-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>60*1024*1024)throw new Error('Thiết kế lớn hơn 60 MB');const clean=validateProject(JSON.parse(await f.text()));const loaded=[];for(const [id,a] of Object.entries(clean.assets)){const img=await load(a.src);if(img.width>4096||img.height>4096)throw new Error('Ảnh quá lớn');loaded.push([id,img])}change(()=>{model=clean.model;assets={...assets,...clean.assets};for(const [id,img]of loaded)engine.assetImages.set(id,img);selectedLayer=null});$('#hand').value=model.current;renderLibrary();fit();toast('Đã mở thiết kế, bạn có thể chỉnh tiếp.')}catch(err){toast(err.message||'Không đọc được thiết kế')}finally{e.target.value=''}};
$('#about').onclick=()=>modal('<h2>Không gian sáng tạo của bạn</h2><p>VIBEU Studio Pro kết hợp ảnh bàn tay, mask từng móng, bề mặt cong mô phỏng và các lớp trang trí. Màu, gradient, sticker và ảnh tải lên đều có thể chỉnh riêng cho từng ngón.</p><p>Đây là trình dựng 2.5D: độ bóng, nhũ và chi tiết nổi được mô phỏng. Kết quả chưa thay thế render 3D hoặc ảnh sản phẩm thật, và không tự đổi dáng móng.</p><p>Bấm Lưu để giữ thiết kế dạng JSON; Mở thiết kế để tiếp tục. Bản HTML này không tự đồng bộ lên Figma.</p>');
window.addEventListener('resize',fit);window.addEventListener('beforeunload',e=>{if(history.length){e.preventDefault();e.returnValue=''}});
try{await Promise.all(SETS.map(async s=>engine.prepare(s,await load(s.image))));$('#loading').hidden=true;$('#app').hidden=false;renderLibrary();refresh();fit()}catch(err){$('#loading').textContent='Không thể mở Studio: '+err.message}
})();
</script></body></html>
