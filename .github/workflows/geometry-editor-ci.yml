name: Geometry Editor CI

on:
  push:
    branches:
      - feat/nail-geometry-editor
      - fix/vibeu-visual-asset-ux-corrective
  pull_request:
    paths:
      - 'app/src/pages/GeometryEditor.tsx'
      - 'app/src/lib/geometryEditor.ts'
      - 'app/src/lib/geometryAdminApi.ts'
      - 'app/src/data/loaders.ts'
      - 'app/src/lib/nailLighting.ts'
      - 'app/src/pages/Studio.tsx'
      - 'app/src/store/studioStore.ts'
      - 'app/src/App.tsx'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Render Studio geometry preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vibeu-geometry-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/studio > /dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu \
            --hide-scrollbars --window-size=1920,1080 \
            --virtual-time-budget=10000 \
            --run-all-compositor-stages-before-draw \
            --screenshot=studio-geometry-preview.png \
            'http://127.0.0.1:4173/studio?tone=cozy&shape=oval&length=S'
          test -s studio-geometry-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: studio-geometry-preview
          path: app/studio-geometry-preview.png
          if-no-files-found: error
