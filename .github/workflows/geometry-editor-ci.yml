name: Geometry Editor CI

on:
  push:
    branches:
      - feat/nail-geometry-editor
  pull_request:
    paths:
      - 'app/src/pages/GeometryEditor.tsx'
      - 'app/src/lib/geometryEditor.ts'
      - 'app/src/App.tsx'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Render editor screenshot
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/vibeu-geometry-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/geometry-editor > /dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu \
            --hide-scrollbars --window-size=1920,1080 \
            --screenshot=geometry-editor.png \
            http://127.0.0.1:4173/geometry-editor
          test -s geometry-editor.png
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-editor-screenshot
          path: app/geometry-editor.png
          if-no-files-found: error
