name: Geometry Editor CI

on:
  push:
    branches:
      - feat/nail-geometry-editor
  pull_request:
    paths:
      - 'app/src/pages/GeometryEditor.tsx'
      - 'app/src/lib/geometryEditor.ts'
      - 'app/src/App.tsx'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

