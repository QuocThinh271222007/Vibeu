name: ChatGPT Visual Review

on:
  push:
    branches:
      - fix/chatgpt-visual-realism-review-20260901

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: app
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite
        working-directory: app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vibeu-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vibeu-vite.log
          exit 1
      - name: Capture visual baselines
        working-directory: app
        run: |
          mkdir -p visual-review
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from './node_modules/playwright/index.mjs';
          const browser = await chromium.launch({headless:true});
          const shots = [
            ['desktop-library','http://127.0.0.1:5173/library',1440,1000],
            ['desktop-studio-empty','http://127.0.0.1:5173/studio',1440,1000],
            ['desktop-studio-strawberry','http://127.0.0.1:5173/studio?template=strawberry-lace-dream',1440,1000],
            ['mobile-library','http://127.0.0.1:5173/library',390,844],
            ['mobile-studio-strawberry','http://127.0.0.1:5173/studio?template=strawberry-lace-dream',390,844]
          ];
          for (const [name,url,w,h] of shots) {
            const page = await browser.newPage({viewport:{width:w,height:h}, deviceScaleFactor:1});
            await page.goto(url,{waitUntil:'networkidle'});
            await page.screenshot({path:`visual-review/${name}.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          EOF
          cp /tmp/capture.mjs ./capture.mjs
          node capture.mjs
          rm capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vibeu-visual-review
          path: app/visual-review/*.png
          if-no-files-found: error
