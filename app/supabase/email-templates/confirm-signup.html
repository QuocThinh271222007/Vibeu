<!--
  Paste into Supabase Dashboard -> Authentication -> Email Templates -> Confirm signup.
  Supabase replaces {{ .ConfirmationURL }} with the real link at send time.
-->
<div style="background:#FFF8F0;padding:32px 16px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border-radius:24px;padding:32px;">
    <p style="font-size:22px;font-weight:700;color:#2B2140;margin:0 0 4px;">VIBEU</p>
    <h1 style="font-size:18px;color:#2B2140;margin:20px 0 8px;">Xác nhận email của bạn</h1>
    <p style="font-size:14px;color:#6B6478;line-height:1.6;margin:0 0 24px;">
      Cảm ơn bạn đã đăng ký VIBEU! Bấm nút bên dưới để xác nhận địa chỉ email và bắt đầu thiết kế bộ nail đầu tiên của bạn.
    </p>
    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block;background:linear-gradient(100deg,#7fa8e0,#ff92f9 55%,#ffd879);color:#2B2140;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:14px;">
      Xác nhận email
    </a>
    <p style="font-size:12px;color:#9A93A6;margin-top:28px;line-height:1.5;">
      Nếu bạn không tạo tài khoản này, có thể bỏ qua email này. Liên kết hết hạn sau một thời gian ngắn vì lý do bảo mật.
    </p>
  </div>
</div>
